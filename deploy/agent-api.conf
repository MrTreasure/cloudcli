# Include inside the NAS HTTPS proxy's http block.
map $http_upgrade $cloudcli_connection {
    default upgrade;
    '' close;
}
map $http_origin $cloudcli_origin_invalid {
    default 1;
    '' 0;
    'https://agent.mrtreasure.cc' 0;
}
# Omit query strings: WebSocket and SSE authentication tokens use the URL.
log_format cloudcli '$remote_addr [$time_local] "$request_method $uri" $status '
                   'request_time=$request_time upstream_time=$upstream_response_time';
server {
    listen [::]:15432 ssl;
    server_name agent-api-nas.mrtreasure.cc;
    access_log /var/log/nginx/cloudcli_access.log cloudcli;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    if ($cloudcli_origin_invalid) { return 403; }
    location ~ ^/(api(?:/|$)|ws$|shell$|plugin-ws/|health$) {
        proxy_pass http://127.0.0.1:18803;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cloudcli_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location / { return 404; }
}
