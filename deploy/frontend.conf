server {
    listen 80;
    server_name agent.mrtreasure.cc;
    root /usr/share/nginx/html/cloudcli;
    index index.html;
    server_tokens off;
    allow 172.21.0.1;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; return 200 'ok'; }
    location ^~ /api/ { return 404; }
    location = /ws { return 404; }
    location = /shell { return 404; }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
